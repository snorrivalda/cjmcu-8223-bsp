syscfg.defs:
    BREWPILL_NAME:
        description: 'Name sent in the BLE scan response'
        value: '"BrewPill"'
    BREWPILL_MEAS_INTERVAL_S:
        description: 'Seconds between readings'
        value: 60
    BREWPILL_ADV_INTERVAL_MS:
        description: 'BLE advertising interval in milliseconds'
        value: 1000
    BREWPILL_ACCEL_SAMPLES:
        description: 'Accelerometer samples (at 50 Hz) averaged per reading'
        value: 50
    BREWPILL_TUBE_AXIS:
        description: >
            LIS3DH axis that runs along the length of the tube:
            0 = X, 1 = Y, 2 = Z.  Hold the pill upright and pick the axis
            that reads close to +/-1000 mg.
        value: 0
    BREWPILL_TEMP_OFFSET_C100:
        description: 'Offset added to the temperature, in 0.01 C'
        value: 0
    BREWPILL_BOOT_BLINK:
        description: 'Blink LED_BLINK_PIN three times at boot'
        value: 1

    # Calibration: SG = C0 + C1*a + C2*a^2 + C3*a^3, a = tilt in degrees.
    # All zero means "not calibrated": only the tilt is broadcast and the
    # receiver can convert it.  Use tools/calibrate.py to fit these.
    BREWPILL_SG_C0:
        description: 'SG polynomial constant term'
        value: 0.0
    BREWPILL_SG_C1:
        description: 'SG polynomial coefficient for tilt'
        value: 0.0
    BREWPILL_SG_C2:
        description: 'SG polynomial coefficient for tilt^2'
        value: 0.0
    BREWPILL_SG_C3:
        description: 'SG polynomial coefficient for tilt^3'
        value: 0.0

syscfg.vals:
    # Broadcast only: no connections, no scanning, no pairing.
    BLE_ROLE_BROADCASTER: 1
    BLE_ROLE_CENTRAL: 0
    BLE_ROLE_OBSERVER: 0
    BLE_ROLE_PERIPHERAL: 0
    BLE_MAX_CONNECTIONS: 1
    BLE_SM_LEGACY: 0
    BLE_SM_SC: 0

    # Liquid absorbs 2.4 GHz well, so use the nRF51's maximum TX power.
    BLE_LL_TX_PWR_DBM: 4

    # The nRF51822 QFAA has only 16 kB of RAM.  A broadcast-only host needs
    # far less than the default 4 kB main stack.
    OS_MAIN_STACK_SIZE: 512

    # No serial console on the pill: keep RAM and power down.
    CONSOLE_IMPLEMENTATION: stub
    LOG_IMPLEMENTATION: stub
    STATS_IMPLEMENTATION: stub
    LOG_LEVEL: 255
