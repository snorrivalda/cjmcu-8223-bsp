pkg.name: apps/brewpill
pkg.type: app
pkg.description: "Floating BLE hydrometer (brew pill) for the CJMCU-8223"
pkg.author: "snorrivalda"
pkg.homepage: "https://github.com/snorrivalda/cjmcu-8223-bsp"
pkg.keywords:
    - hydrometer
    - homebrew
    - ble

pkg.deps:
    - "@apache-mynewt-core/kernel/os"
    - "@apache-mynewt-core/sys/console"
    - "@apache-mynewt-core/sys/log"
    - "@apache-mynewt-core/sys/log/modlog"
    - "@apache-mynewt-core/sys/stats"
    - "@apache-mynewt-nimble/nimble/host"
    - "@apache-mynewt-nimble/nimble/host/util"

pkg.lflags:
    - -lm
