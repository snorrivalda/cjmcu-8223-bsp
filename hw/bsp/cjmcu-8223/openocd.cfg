# OpenOCD configuration for the CJMCU-8223 (nRF51822) over SWD.
#
# The probe is chosen with the CJMCU_PROBE environment variable:
#   stlink    ST-Link V2, including cheap clones (default)
#   jlink     SEGGER J-Link
#   cmsis-dap CMSIS-DAP / DAPLink
# e.g.  CJMCU_PROBE=jlink newt load pill

gdb_memory_map enable
gdb_flash_program enable

set _probe stlink
if {[info exists ::env(CJMCU_PROBE)]} {
    set _probe $::env(CJMCU_PROBE)
}

switch $_probe {
    stlink {
        source [find interface/stlink.cfg]
        transport select hla_swd
    }
    jlink {
        source [find interface/jlink.cfg]
        transport select swd
    }
    cmsis-dap {
        source [find interface/cmsis-dap.cfg]
        transport select swd
    }
    default {
        error "Unknown CJMCU_PROBE '$_probe' (use stlink, jlink or cmsis-dap)"
    }
}

adapter speed 1000

source [find target/nrf51.cfg]
