# OpenOCD configuration for the CJMCU-8223 (nRF51822) over SWD.
# Uses a SEGGER J-Link by default; to use another SWD probe (ST-Link,
# CMSIS-DAP, ...) replace the interface line, e.g.
#   source [find interface/stlink.cfg]

gdb_memory_map enable
gdb_flash_program enable

source [find interface/jlink.cfg]
transport select swd
adapter speed 1000

source [find target/nrf51.cfg]
